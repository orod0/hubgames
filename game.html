<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Survivor: Senior Edition</title>
    <style>
        /* ESTÉTICA E UI */
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        
        /* HUD Superior */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; pointer-events: none; box-sizing: border-box; }
        .bar-container { width: 300px; height: 20px; background: #333; margin-bottom: 10px; border-radius: 10px; overflow: hidden; border: 2px solid #000; position: relative; }
        .bar-fill { height: 100%; width: 100%; transform-origin: left; transition: transform 0.2s; }
        #hp-bar { background: #e74c3c; }
        #xp-bar { background: #3498db; }
        #stats-display { position: absolute; top: 20px; right: 20px; text-align: right; font-size: 14px; color: #aaa; }
        
        /* Tela de Level Up (Cartas) */
        #levelup-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        #levelup-overlay.active { display: flex; pointer-events: auto; }
        .cards-container { display: flex; gap: 20px; margin-top: 20px; }
        .card {
            background: #2c3e50; width: 200px; height: 280px; border-radius: 8px; border: 2px solid #34495e;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s, background 0.2s; padding: 15px; text-align: center;
        }
        .card:hover { transform: scale(1.05); background: #34495e; border-color: #f1c40f; }
        .card h3 { color: #f1c40f; margin-bottom: 10px; }
        .card p { font-size: 14px; color: #ecf0f1; }
        
        /* Tela de Game Over */
        #gameover-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(192, 57, 43, 0.9); align-items: center; justify-content: center; flex-direction: column; z-index: 20;
        }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: white; border: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- CAMADA DE INTERFACE -->
    <div id="ui-layer">
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div></div>
        <div class="bar-container"><div id="xp-bar" class="bar-fill" style="transform: scaleX(0);"></div></div>
        <h2 id="level-display">Level: 1</h2>
        <div id="stats-display">
            DMG: <span id="stat-dmg">10</span> | SPD: <span id="stat-spd">200</span> | CD: <span id="stat-cd">0.5s</span>
        </div>
    </div>

    <!-- OVERLAY DE LEVEL UP -->
    <div id="levelup-overlay">
        <h1>LEVEL UP!</h1>
        <p>Escolha um upgrade</p>
        <div class="cards-container" id="cards-container"></div>
    </div>

    <!-- OVERLAY DE GAME OVER -->
    <div id="gameover-screen">
        <h1>VOCÊ MORREU</h1>
        <h2 id="final-score">Level Alcançado: 1</h2>
        <button onclick="location.reload()">Tentar Novamente</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * ARQUITETURA DE CÓDIGO SÊNIOR
 * 1. Object Pooling: Reutilização de memória para evitar Garbage Collection em loops intensos.
 * 2. DeltaTime: Movimento independente da taxa de quadros (funciona em 60hz, 144hz, etc).
 * 3. State Machine: Controle claro entre Jogando, Pausado, Level Up.
 */

// --- CONSTANTES & CONFIGURAÇÕES ---
const CONSTANTS = {
    PLAYER_SIZE: 20,
    ENEMY_BASE_SPEED: 100,
    ENEMY_SPAWN_RATE: 0.5, // Segundos
    BASE_XP_REQ: 20,
    COLORS: {
        PLAYER: '#3498db',
        ENEMY: '#e74c3c',
        BULLET: '#f1c40f',
        GEM: '#2ecc71'
    }
};

// --- GERENCIADOR DE INPUT (Mouse + Teclado) ---
class InputHandler {
    constructor() {
        this.keys = {};
        this.mouse = { x: 0, y: 0 };
        
        window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => {
            this.mouse.x = e.clientX;
            this.mouse.y = e.clientY;
        });
    }

    getMovementVector() {
        let x = 0, y = 0;
        if (this.keys['w']) y -= 1;
        if (this.keys['s']) y += 1;
        if (this.keys['a']) x -= 1;
        if (this.keys['d']) x += 1;

        // Normalização do vetor (evitar movimento mais rápido na diagonal)
        if (x !== 0 || y !== 0) {
            const length = Math.sqrt(x * x + y * y);
            x /= length;
            y /= length;
        }
        return { x, y };
    }
}

// --- OBJECT POOL GENÉRICO (Performance Crítica) ---
class ObjectPool {
    constructor(createFunc, initialSize = 100) {
        this.createFunc = createFunc;
        this.pool = [];
        this.active = [];
        
        for (let i = 0; i < initialSize; i++) {
            this.pool.push(this.createFunc());
        }
    }

    get() {
        const obj = this.pool.length > 0 ? this.pool.pop() : this.createFunc();
        obj.active = true;
        this.active.push(obj);
        return obj;
    }

    release(obj) {
        obj.active = false;
        // Remove da lista de ativos (O(n) - pode ser otimizado com swap-pop se a ordem não importar, mas filter é mais legível aqui)
        const index = this.active.indexOf(obj);
        if (index > -1) {
            this.active.splice(index, 1);
            this.pool.push(obj);
        }
    }

    // Método rápido para limpar projéteis/inimigos no reinício
    clearAll() {
        this.pool = this.pool.concat(this.active);
        this.active = [];
    }
}

// --- ENTIDADES ---

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = CONSTANTS.PLAYER_SIZE;
        this.angle = 0; // Olhar para o mouse
        
        // Stats
        this.hp = 100;
        this.maxHp = 100;
        this.speed = 250; // pixels por segundo
        this.damage = 10;
        this.fireRate = 0.4; // segundos entre tiros
        this.projectileCount = 1;
        
        // Progressão
        this.level = 1;
        this.xp = 0;
        this.xpToNextLevel = CONSTANTS.BASE_XP_REQ;
        
        // Controle de tiro
        this.fireTimer = 0;
    }

    update(dt, input, enemies, bulletPool) {
        // Movimento
        const moveDir = input.getMovementVector();
        this.x += moveDir.x * this.speed * dt;
        this.y += moveDir.y * this.speed * dt;

        // Manter na tela
        this.x = Math.max(this.radius, Math.min(window.innerWidth - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(window.innerHeight - this.radius, this.y));

        // Rotação (Visual segue o mouse)
        this.angle = Math.atan2(input.mouse.y - this.y, input.mouse.x - this.x);

        // Combate (Auto-fire no mais próximo)
        this.fireTimer -= dt;
        if (this.fireTimer <= 0 && enemies.length > 0) {
            this.fire(enemies, bulletPool);
        }
    }

    fire(enemies, bulletPool) {
        // Encontra inimigo mais próximo
        let nearest = null;
        let minDist = Infinity;

        for (const enemy of enemies) {
            const dx = enemy.x - this.x;
            const dy = enemy.y - this.y;
            const distSq = dx*dx + dy*dy;
            if (distSq < minDist) {
                minDist = distSq;
                nearest = enemy;
            }
        }

        if (nearest) {
            // Reinicia timer
            this.fireTimer = this.fireRate;
            
            // Calcula direção do tiro
            const angleToEnemy = Math.atan2(nearest.y - this.y, nearest.x - this.x);
            
            // Multishot logic (Leque simples)
            const spread = 0.2; // Radianos
            const startAngle = angleToEnemy - (spread * (this.projectileCount - 1)) / 2;

            for (let i = 0; i < this.projectileCount; i++) {
                const bullet = bulletPool.get();
                const currentAngle = startAngle + (i * spread);
                bullet.spawn(this.x, this.y, currentAngle, this.damage);
            }
        }
    }

    gainXp(amount) {
        this.xp += amount;
        if (this.xp >= this.xpToNextLevel) {
            this.xp -= this.xpToNextLevel;
            this.level++;
            this.xpToNextLevel = Math.floor(this.xpToNextLevel * 1.5);
            return true; // Level Up trigger
        }
        return false;
    }
}

class Bullet {
    constructor() {
        this.active = false;
        this.x = 0; this.y = 0;
        this.vx = 0; this.vy = 0;
        this.radius = 5;
        this.damage = 10;
        this.speed = 600;
        this.life = 0;
    }

    spawn(x, y, angle, damage) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.damage = damage;
        this.life = 2.0; // Segundos de vida
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
        return this.life > 0;
    }
}

class Enemy {
    constructor() {
        this.active = false;
        this.x = 0; this.y = 0;
        this.width = 25; this.height = 25; // Quadrados
        this.hp = 20;
        this.speed = 100;
        this.damage = 10;
    }

    spawn(playerLevel) {
        // Spawn fora da tela (lógica simplificada de bordas)
        const side = Math.floor(Math.random() * 4);
        const buffer = 50;
        const w = window.innerWidth;
        const h = window.innerHeight;

        switch(side) {
            case 0: this.x = Math.random() * w; this.y = -buffer; break; // Topo
            case 1: this.x = Math.random() * w; this.y = h + buffer; break; // Baixo
            case 2: this.x = -buffer; this.y = Math.random() * h; break; // Esquerda
            case 3: this.x = w + buffer; this.y = Math.random() * h; break; // Direita
        }

        // Scaling de dificuldade
        this.hp = 20 + (playerLevel * 5);
        this.speed = CONSTANTS.ENEMY_BASE_SPEED + (playerLevel * 2);
    }

    update(dt, playerX, playerY) {
        // Chase Logic
        const dx = playerX - this.x;
        const dy = playerY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
            this.x += (dx / dist) * this.speed * dt;
            this.y += (dy / dist) * this.speed * dt;
        }
    }
}

class XpGem {
    constructor() {
        this.active = false;
        this.x = 0; this.y = 0;
        this.value = 10;
        this.radius = 4;
        this.magnetized = false;
    }

    spawn(x, y, value) {
        this.x = x;
        this.y = y;
        this.value = value;
        this.magnetized = false;
    }

    update(dt, player) {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const distSq = dx*dx + dy*dy;

        // Magnetismo ao chegar perto (150px)
        if (distSq < 22500) { 
            this.magnetized = true;
        }

        if (this.magnetized) {
            const dist = Math.sqrt(distSq);
            const speed = 400; // Velocidade de coleta rápida
            this.x += (dx / dist) * speed * dt;
            this.y += (dy / dist) * speed * dt;
        }
    }
}

// --- CLASSE PRINCIPAL DO JOGO ---

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.input = new InputHandler();
        
        this.state = 'PLAYING'; // PLAYING, PAUSED, GAMEOVER
        this.lastTime = 0;
        this.spawnTimer = 0;

        // Pools
        this.bulletPool = new ObjectPool(() => new Bullet());
        this.enemyPool = new ObjectPool(() => new Enemy(), 500);
        this.gemPool = new ObjectPool(() => new XpGem(), 200);

        // Player
        this.player = new Player(window.innerWidth/2, window.innerHeight/2);

        // Sistema de Cards
        this.possibleUpgrades = [
            { id: 'dmg', title: 'Dano Maior', desc: '+5 de Dano', apply: (p) => p.damage += 5 },
            { id: 'spd', title: 'Pés Ligeiros', desc: '+10% Velocidade', apply: (p) => p.speed *= 1.1 },
            { id: 'rate', title: 'Gatilho Rápido', desc: '-10% Cooldown', apply: (p) => p.fireRate *= 0.9 },
            { id: 'multi', title: 'Multishot', desc: '+1 Projétil', apply: (p) => p.projectileCount += 1 },
            { id: 'heal', title: 'Cura Total', desc: 'Recupera HP', apply: (p) => p.hp = p.maxHp }
        ];

        // Bindings
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // UI
        this.uiHp = document.getElementById('hp-bar');
        this.uiXp = document.getElementById('xp-bar');
        this.uiLevel = document.getElementById('level-display');
        this.overlayLevel = document.getElementById('levelup-overlay');
        this.cardsContainer = document.getElementById('cards-container');

        // Start
        requestAnimationFrame(t => this.loop(t));
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    loop(timestamp) {
        if (this.state === 'GAMEOVER') return;

        const dt = (timestamp - this.lastTime) / 1000;
        this.lastTime = timestamp;

        if (this.state === 'PLAYING') {
            // Limitar dt para evitar bugs se a aba ficar inativa (max 0.1s)
            const safeDt = Math.min(dt, 0.1);
            
            this.update(safeDt);
            this.draw();
        }

        requestAnimationFrame(t => this.loop(t));
    }

    update(dt) {
        // --- Spawning ---
        this.spawnTimer -= dt;
        if (this.spawnTimer <= 0) {
            const enemy = this.enemyPool.get();
            enemy.spawn(this.player.level);
            // Spawn rate aumenta com o tempo (limite 0.1s)
            this.spawnTimer = Math.max(0.1, CONSTANTS.ENEMY_SPAWN_RATE - (this.player.level * 0.02));
        }

        // --- Player ---
        this.player.update(dt, this.input, this.enemyPool.active, this.bulletPool);

        // --- Bullets ---
        for (let i = this.bulletPool.active.length - 1; i >= 0; i--) {
            const b = this.bulletPool.active[i];
            if (!b.update(dt)) {
                this.bulletPool.release(b);
            }
        }

        // --- Enemies & Colisões ---
        // Usamos loops reversos para poder remover itens com segurança
        for (let i = this.enemyPool.active.length - 1; i >= 0; i--) {
            const e = this.enemyPool.active[i];
            e.update(dt, this.player.x, this.player.y);

            // Colisão Player vs Enemy (Círculo vs Retângulo Simplificado)
            const distToPlayer = Math.hypot(this.player.x - e.x, this.player.y - e.y);
            if (distToPlayer < this.player.radius + e.width/2) {
                this.player.hp -= 20 * dt; // Dano por segundo de contato
                if (this.player.hp <= 0) this.gameOver();
            }

            // Colisão Bullet vs Enemy
            for (let j = this.bulletPool.active.length - 1; j >= 0; j--) {
                const b = this.bulletPool.active[j];
                const distToBullet = Math.hypot(b.x - e.x, b.y - e.y);
                
                if (distToBullet < e.width/2 + b.radius) {
                    e.hp -= b.damage;
                    this.bulletPool.release(b); // Bala some
                    
                    if (e.hp <= 0) {
                        // Drop Gem
                        const gem = this.gemPool.get();
                        gem.spawn(e.x, e.y, 10 + this.player.level);
                        
                        this.enemyPool.release(e);
                        break; // Inimigo morreu, para de checar balas nele
                    }
                }
            }
        }

        // --- Gems (XP) ---
        for (let i = this.gemPool.active.length - 1; i >= 0; i--) {
            const g = this.gemPool.active[i];
            g.update(dt, this.player);

            // Coleta
            const dist = Math.hypot(this.player.x - g.x, this.player.y - g.y);
            if (dist < this.player.radius + g.radius) {
                const leveledUp = this.player.gainXp(g.value);
                this.gemPool.release(g);
                if (leveledUp) this.triggerLevelUp();
            }
        }

        this.updateUI();
    }

    draw() {
        // Limpar tela
        this.ctx.fillStyle = '#1a1a1a';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Grid de fundo para sensação de movimento
        this.drawGrid();

        // Desenhar Gems
        this.ctx.fillStyle = CONSTANTS.COLORS.GEM;
        this.gemPool.active.forEach(g => {
            this.ctx.beginPath();
            this.ctx.arc(g.x, g.y, g.radius, 0, Math.PI*2);
            this.ctx.fill();
        });

        // Desenhar Balas
        this.ctx.fillStyle = CONSTANTS.COLORS.BULLET;
        this.bulletPool.active.forEach(b => {
            this.ctx.beginPath();
            this.ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
            this.ctx.fill();
        });

        // Desenhar Inimigos (Quadrados)
        this.ctx.fillStyle = CONSTANTS.COLORS.ENEMY;
        this.enemyPool.active.forEach(e => {
            this.ctx.fillRect(e.x - e.width/2, e.y - e.height/2, e.width, e.height);
        });

        // Desenhar Player (Círculo com indicador de direção visual)
        this.ctx.save();
        this.ctx.translate(this.player.x, this.player.y);
        this.ctx.rotate(this.player.angle);
        
        // Corpo
        this.ctx.fillStyle = CONSTANTS.COLORS.PLAYER;
        this.ctx.beginPath();
        this.ctx.arc(0, 0, this.player.radius, 0, Math.PI*2);
        this.ctx.fill();
        
        // Olhos/Direção
        this.ctx.fillStyle = 'white';
        this.ctx.beginPath();
        this.ctx.arc(10, 0, 5, 0, Math.PI*2); // Olho na frente
        this.ctx.fill();
        
        this.ctx.restore();
    }

    drawGrid() {
        this.ctx.strokeStyle = '#2c3e50';
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        const size = 100;
        // Desenha um grid estático apenas para referência visual
        for (let x = 0; x <= this.canvas.width; x += size) {
            this.ctx.moveTo(x, 0);
            this.ctx.lineTo(x, this.canvas.height);
        }
        for (let y = 0; y <= this.canvas.height; y += size) {
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(this.canvas.width, y);
        }
        this.ctx.stroke();
    }

    updateUI() {
        const hpPct = Math.max(0, this.player.hp / this.player.maxHp);
        const xpPct = this.player.xp / this.player.xpToNextLevel;
        
        this.uiHp.style.transform = `scaleX(${hpPct})`;
        this.uiXp.style.transform = `scaleX(${xpPct})`;
        this.uiLevel.innerText = `Level: ${this.player.level}`;

        document.getElementById('stat-dmg').innerText = Math.round(this.player.damage);
        document.getElementById('stat-spd').innerText = Math.round(this.player.speed);
        document.getElementById('stat-cd').innerText = this.player.fireRate.toFixed(2) + 's';
    }

    // --- LÓGICA DE LEVEL UP ---

    triggerLevelUp() {
        this.state = 'PAUSED';
        this.overlayLevel.classList.add('active');
        this.cardsContainer.innerHTML = '';

        // Selecionar 3 upgrades aleatórios
        const cards = [];
        for(let i=0; i<3; i++) {
            const randomUpgrade = this.possibleUpgrades[Math.floor(Math.random() * this.possibleUpgrades.length)];
            cards.push(randomUpgrade);
        }

        // Criar elementos DOM
        cards.forEach(cardData => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `<h3>${cardData.title}</h3><p>${cardData.desc}</p>`;
            el.onclick = () => this.selectUpgrade(cardData);
            this.cardsContainer.appendChild(el);
        });
    }

    selectUpgrade(upgrade) {
        upgrade.apply(this.player);
        this.overlayLevel.classList.remove('active');
        this.lastTime = performance.now(); // Reset time para evitar salto enorme de dt
        this.state = 'PLAYING';
    }

    gameOver() {
        this.state = 'GAMEOVER';
        document.getElementById('gameover-screen').style.display = 'flex';
        document.getElementById('final-score').innerText = `Level Alcançado: ${this.player.level}`;
    }
}

// Inicializar Jogo
window.onload = () => {
    const game = new Game();
};

</script>
</body>
</html>
